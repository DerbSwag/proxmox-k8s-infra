apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lark-alert-adapter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/company-lab-infra
    targetRevision: HEAD
    path: k8s/monitoring/lark-alert-adapter
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=ghcr.io/derbswag/devops-api
    argocd-image-updater.argoproj.io/app.update-strategy: latest
    argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/company-lab-infra
    targetRevision: HEAD
    path: helm/fastapi
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/company-lab-infra
    targetRevision: HEAD
    path: k8s/network-policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-alerts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/company-lab-infra
    targetRevision: HEAD
    path: k8s/monitoring
    directory:
      include: "custom-alerts.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bind9-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/company-lab-infra
    targetRevision: HEAD
    path: k8s/dns/bind9
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
