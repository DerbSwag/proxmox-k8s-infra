apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-nginx-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DerbSwag/proxmox-k8s-infra
    targetRevision: HEAD
    path: k8s/lab-nginx-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
