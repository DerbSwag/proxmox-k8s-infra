name: Validate Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'helm/**'
      - 'scripts/**'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}, truthy: disable}}' \
            k8s/ helm/

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          find k8s/ -name '*.yaml' -o -name '*.yml' | \
            xargs kubeconform -strict -ignore-missing-schemas -summary

  netpol-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Apply NetworkPolicies
        run: |
          # Create namespaces
          kubectl apply -f k8s/namespaces/namespaces.yaml || true
          # Apply network policies
          kubectl apply -f k8s/network-policies/ || true
          # Apply kube-system policies if any security-hardening netpols exist
          kubectl apply -f k8s/security-hardening/network-policies.yaml || true

      - name: Deploy CoreDNS allow-dns policy
        run: kubectl apply -f k8s/network-policies/allow-dns.yaml

      - name: Test DNS resolution across namespaces
        run: |
          echo "Waiting for CoreDNS to be ready..."
          kubectl wait --for=condition=ready pod -l k8s-app=kube-dns -n kube-system --timeout=60s

          FAIL=0
          for ns in default monitoring zabbix infra; do
            kubectl create namespace "$ns" 2>/dev/null || true
            kubectl run dns-test -n "$ns" --restart=Never --image=busybox:1.36 \
              --command -- sh -c "nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1 && echo OK || echo FAIL"

            for i in $(seq 1 30); do
              STATUS=$(kubectl get pod dns-test -n "$ns" -o jsonpath='{.status.phase}' 2>/dev/null)
              [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ] && break
              sleep 1
            done

            RESULT=$(kubectl logs dns-test -n "$ns" 2>/dev/null)
            kubectl delete pod dns-test -n "$ns" --grace-period=0 --force >/dev/null 2>&1 || true

            if [ "$RESULT" = "OK" ]; then
              echo "✅ [$ns] DNS resolution OK"
            else
              echo "🔴 [$ns] DNS resolution FAILED"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::DNS resolution failed in $FAIL namespace(s). NetworkPolicy may be blocking DNS."
            exit 1
          fi


      - name: Test API server access from pods
        run: |
          echo "Testing API server connectivity from pods in each namespace..."
          FAIL=0
          for ns in default monitoring zabbix infra; do
            kubectl create namespace "$ns" 2>/dev/null || true
            kubectl run api-test -n "$ns" --restart=Never --image=busybox:1.36 \
              --command -- sh -c "wget -qO- --no-check-certificate --timeout=5 https://kubernetes.default.svc:443/version >/dev/null 2>&1 && echo OK || echo FAIL"

            for i in $(seq 1 30); do
              STATUS=$(kubectl get pod api-test -n "$ns" -o jsonpath='{.status.phase}' 2>/dev/null)
              [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ] && break
              sleep 1
            done

            RESULT=$(kubectl logs api-test -n "$ns" 2>/dev/null)
            kubectl delete pod api-test -n "$ns" --grace-period=0 --force >/dev/null 2>&1 || true

            if [ "$RESULT" = "OK" ]; then
              echo "✅ [$ns] API server reachable"
            else
              echo "🔴 [$ns] API server UNREACHABLE - check egress NetworkPolicy"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::API server unreachable from $FAIL namespace(s). Egress NetworkPolicy may be blocking port 6443."
            exit 1
          fi
