name: Validate Infrastructure

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'k8s/**'
      - 'helm/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint static YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable, indentation: disable}}' \
            k8s/ helm/*/values.yaml

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          find k8s/ -type f \( -name '*.yaml' -o -name '*.yml' \) \
            ! -name 'k3s-config.yaml' \
            ! -name 'k3s-config-worker.yaml' \
            -print0 | \
            xargs -0 kubeconform -strict -ignore-missing-schemas -summary
