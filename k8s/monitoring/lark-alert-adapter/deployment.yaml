apiVersion: apps/v1
kind: Deployment
metadata:
  name: lark-alert-adapter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lark-alert-adapter
  template:
    metadata:
      labels:
        app: lark-alert-adapter
    spec:
      containers:
      - name: adapter
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json, urllib.request, threading, time
          LARK_URL = "https://open.larksuite.com/open-apis/bot/v2/hook/YOUR_WEBHOOK_ID"
          alerts_total = 0
          alerts_failed = 0
          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args): pass
              def do_GET(self):
                  if self.path == '/metrics':
                      body = f"# HELP lark_alerts_total Total alerts forwarded\n# TYPE lark_alerts_total counter\nlark_alerts_total {alerts_total}\n# HELP lark_alerts_failed_total Failed alert forwards\n# TYPE lark_alerts_failed_total counter\nlark_alerts_failed_total {alerts_failed}\n"
                      self.send_response(200)
                      self.send_header('Content-Type','text/plain')
                      self.end_headers()
                      self.wfile.write(body.encode())
                  else:
                      self.send_response(404)
                      self.end_headers()
              def do_POST(self):
                  global alerts_total, alerts_failed
                  data = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  for alert in data.get('alerts', []):
                      status = alert['status'].upper()
                      name = alert['labels'].get('alertname', 'Unknown')
                      instance = alert['labels'].get('instance', 'N/A')
                      desc = alert['annotations'].get('description', alert['annotations'].get('summary', ''))
                      icon = "FIRING" if status == "FIRING" else "RESOLVED"
                      msg = {"msg_type": "text", "content": {"text": f"[{icon}] {name} | {instance} | {desc}"}}
                      try:
                          req = urllib.request.Request(LARK_URL, json.dumps(msg).encode(), {"Content-Type": "application/json"})
                          urllib.request.urlopen(req)
                          alerts_total += 1
                      except Exception:
                          alerts_failed += 1
                  self.send_response(200)
                  self.end_headers()
          HTTPServer(('0.0.0.0', 5001), Handler).serve_forever()
        ports:
        - containerPort: 5001
          name: http
