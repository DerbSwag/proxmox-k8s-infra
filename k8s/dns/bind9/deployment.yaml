apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind9
  namespace: infra
  labels:
    app: bind9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind9
  template:
    metadata:
      labels:
        app: bind9
    spec:
      containers:
        - name: bind9
          image: ubuntu/bind9:latest
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: bind9-config
              mountPath: /etc/bind/named.conf.local
              subPath: named.conf.local
            - name: bind9-config
              mountPath: /etc/bind/zones/db.lab.local
              subPath: db.lab.local
            - name: bind9-config
              mountPath: /etc/bind/zones/db.192.0.2
              subPath: db.192.0.2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: bind9-config
          configMap:
            name: bind9-config
