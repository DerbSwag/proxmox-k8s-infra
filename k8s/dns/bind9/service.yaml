apiVersion: v1
kind: Service
metadata:
  name: bind9
  namespace: infra
  labels:
    app: bind9
spec:
  type: NodePort
  selector:
    app: bind9
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
      nodePort: 30053
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
      nodePort: 30054
