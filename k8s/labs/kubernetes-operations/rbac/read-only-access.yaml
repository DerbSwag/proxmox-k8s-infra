apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-reader, namespace: <namespace>}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: <namespace>}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-reader, namespace: <namespace>}
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: <namespace>
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
