apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: <namespace>}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-controller-to-nginx, namespace: <namespace>}
spec:
  podSelector: {matchLabels: {app: nginx-kustomize}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: <ingress-controller-namespace>}
      ports: [{protocol: TCP, port: 80}]
