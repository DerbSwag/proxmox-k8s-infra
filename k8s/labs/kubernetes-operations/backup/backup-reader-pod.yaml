apiVersion: v1
kind: Pod
metadata:
  name: backup-reader
  namespace: <namespace>
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command: [sh, -c, sleep 3600]
      volumeMounts: [{name: backups, mountPath: /backups}]
  volumes:
    - name: backups
      persistentVolumeClaim: {claimName: postgres-backup}
