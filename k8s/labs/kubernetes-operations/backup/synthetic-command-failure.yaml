apiVersion: batch/v1
kind: Job
metadata:
  name: backup-command-failure
  namespace: <namespace>
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: postgres:16
          command: [/bin/sh, -ec, "pg_dump_intentionally_missing --version"]
